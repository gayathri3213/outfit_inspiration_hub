apiVersion: apps/v1
kind: Deployment
metadata:
  name: outfithubinspirationapp-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: outfithubinspirationapp
  template:
    metadata:
      labels:
        app: outfithubinspirationapp
    spec:
      containers:
        - name: outfithubinspirationapp
          image: gayathri3123/outfit_hub_inspiration_repository:outfithubinspirationimage # use your Docker Hub image
          ports:
            - containerPort: 5000
